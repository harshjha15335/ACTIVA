name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: CPU-only PyTorch (once a module needs it)
        run: |
          pins=$(grep -iE '^(torch|torchvision)==' requirements.txt || true)
          if [ -n "$pins" ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu $pins
          fi
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: run.sh is executable with LF endings
        run: test -x run.sh && ! grep -q $'\r' run.sh
      - name: Tests (CPU, stubs, synthetic videos)
        run: python -m pytest -q
